          cat > app/src/main/java/com/venice/poolaim/MainActivity.kt <<'EOF'
          package com.venice.poolaim

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.Toast

          class MainActivity : Activity() {

              private val reqProj = 100

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }

                  findViewById<Button>(R.id.btnPerm).setOnClickListener {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")))
                  }

                  findViewById<Button>(R.id.btnStart).setOnClickListener {
                      if (!Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "Pehle overlay permission do", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }
                      val mpm = getSystemService(MediaProjectionManager::class.java)
                      startActivityForResult(mpm.createScreenCaptureIntent(), reqProj)
                  }

                  findViewById<Button>(R.id.btnStop).setOnClickListener {
                      stopService(Intent(this, OverlayService::class.java))
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == reqProj && resultCode == RESULT_OK && data != null) {
                      val i = Intent(this, OverlayService::class.java)
                          .setAction(OverlayService.ACTION_START)
                          .putExtra(OverlayService.EXTRA_CODE, resultCode)
                          .putExtra(OverlayService.EXTRA_DATA, data)
                      startForegroundService(i)
                      moveTaskToBack(true)
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/venice/poolaim/Detector.kt <<'EOF'
          package com.venice.poolaim

          import java.nio.ByteBuffer

          object Detector {

              class Det(val fx: Float, val fy: Float, val color: Int)

              private fun classify(r: Int, g: Int, b: Int): Int {
                  val mx = maxOf(r, g, b)
                  val mn = minOf(r, g, b)
                  val sat = mx - mn
                  if (mx < 50) return 8
                  if (g > r + 25 && g > b + 18 && mx < 140) return -1
                  if (r > 198 && g > 198 && b > 190) return 0
                  if (sat < 45) return -1
                  if (r > 160 && g > 125 && b < 120) return 1
                  if (b > 125 && r < 115) return 2
                  if (r > 135 && g < 105 && b < 105) return 3
                  if (r > 90 && b > 120 && g < 105) return 4
                  if (r > 185 && g in 100..190 && b < 95) return 5
                  if (g > 100 && r < 115 && b < 120) return 6
                  if (r in 85..190 && g in 50..125 && b < 95) return 7
                  return -1
              }

              fun detect(buf: ByteBuffer, w: Int, h: Int, rowStride: Int, pixStride: Int): List<Det> {
                  val cell = maxOf(4, h / 20)
                  val cols = w / cell + 1
                  val rows = h / cell + 1
                  val count = IntArray(cols * rows)
                  val sumX = IntArray(cols * rows)
                  val sumY = IntArray(cols * rows)
                  val votes = Array(cols * rows) { IntArray(9) }

                  var y = 0
                  while (y < h) {
                      var x = 0
                      val rowBase = y * rowStride
                      while (x < w) {
                          val off = rowBase + x * pixStride
                          if (off + 2 < buf.limit()) {
                              val r = buf.get(off).toInt() and 0xFF
                              val g = buf.get(off + 1).toInt() and 0xFF
                              val b = buf.get(off + 2).toInt() and 0xFF
                              val c = classify(r, g, b)
                              if (c >= 0) {
                                  val idx = (y / cell) * cols + (x / cell)
                                  count[idx]++
                                  sumX[idx] += x
                                  sumY[idx] += y
                                  votes[idx][c]++
                              }
                          }
                          x += 2
                      }
                      y += 2
                  }

                  val out = mutableListOf<Det>()
                  for (i in count.indices) {
                      if (count[i] < 6) continue
                      var bestC = 0
                      for (c in 1..8) if (votes[i][c] > votes[i][bestC]) bestC = c
                      val fx = (sumX[i].toFloat() / count[i]) / w
                      val fy = (sumY[i].toFloat() / count[i]) / h
                      out.add(Det(fx, fy, bestC))
                  }
                  return out
              }
          }
          EOF

          cat > app/src/main/java/com/venice/poolaim/OverlayService.kt <<'EOF'
          package com.venice.poolaim

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.content.res.Configuration
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.view.Gravity
          import android.view.WindowManager
          import kotlin.math.max

          class OverlayService : Service() {
              private lateinit var wm: WindowManager
              private var view: AimView? = null
              private var params: WindowManager.LayoutParams? = null
              private var locked = false

              private var thread: HandlerThread? = null
              private var bg: Handler? = null
              private var main: Handler? = null
              private var projection: MediaProjection? = null
              private var display: VirtualDisplay? = null
              private var reader: ImageReader? = null
              private var lastCapture = 0L

              override fun onBind(i: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  getSystemService(NotificationManager::class.java)
                      .createNotificationChannel(NotificationChannel(CH, "Overlay", NotificationManager.IMPORTANCE_LOW))
                  startForeground(1, buildNotification())

                  thread = HandlerThread("cap").also { it.start() }
                  bg = Handler(thread!!.looper)
                  main = Handler(mainLooper)

                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val v = AimView(this)
                  v.onExit = { stopSelf() }
                  v.onLock = { lock() }
                  val p = makeParams(true)
                  wm.addView(v, p)
                  view = v
                  params = p
              }

              private fun makeParams(touchable: Boolean): WindowManager.LayoutParams {
                  var flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                      WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                      WindowManager.LayoutParams.FLAG_SECURE
                  if (!touchable) {
                      flags = flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  }
                  val p = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      flags,
                      PixelFormat.TRANSLUCENT
                  )
                  p.gravity = Gravity.TOP or Gravity.START
                  return p
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  val v = view ?: return
                  val p = params ?: return
                  runCatching {
                      wm.updateViewLayout(v, p)
                      v.requestLayout()
                      v.invalidate()
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_UNLOCK -> unlock()
                      ACTION_START -> {
                          val code = intent.getIntExtra(EXTRA_CODE, 0)
                          val data = intent.getParcelableExtra(EXTRA_DATA) as? Intent
                          if (data != null) startCapture(code, data)
                      }
                  }
                  return START_STICKY
              }

              private fun startCapture(code: Int, data: Intent) {
                  if (projection != null) return
                  val mpm = getSystemService(MediaProjectionManager::class.java)
                  val mp = mpm.getMediaProjection(code, data) ?: return
                  projection = mp

                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, buildNotification(),
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION or
                              ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  }

                  mp.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          runCatching { reader?.close() }
                          runCatching { display?.release() }
                          reader = null
                          display = null
                          projection = null
                      }
                  }, bg)

                  val dm = resources.displayMetrics
                  val cw = max(240, dm.widthPixels / 3)
                  val ch = max(240, dm.heightPixels / 3)
                  val r = ImageReader.newInstance(cw, ch, PixelFormat.RGBA_8888, 2)
                  reader = r
                  display = mp.createVirtualDisplay(
                      "poolcap", cw, ch, dm.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, r.surface, null, bg
                  )

                  r.setOnImageAvailableListener({ rd ->
                      val now = System.currentTimeMillis()
                      if (now - lastCapture < 700) {
                          runCatching { rd.acquireLatestImage()?.close() }
                          return@setOnImageAvailableListener
                      }
                      lastCapture = now
                      val img = runCatching { rd.acquireLatestImage() }.getOrNull() ?: return@setOnImageAvailableListener
                      try {
                          val plane = img.planes[0]
                          val buf = plane.buffer
                          val found = Detector.detect(buf, img.width, img.height, plane.rowStride, plane.pixelStride)
                          val target = view
                          if (target != null) main?.post { target.applyDetected(found) }
                      } catch (t: Throwable) {
                      } finally {
                          runCatching { img.close() }
                      }
                  }, bg)
              }

              private fun lock() {
                  if (locked) return
                  val v = view ?: return
                  locked = true
                  v.locked = true
                  v.invalidate()
                  val p = makeParams(false)
                  params = p
                  runCatching {
                      wm.removeView(v)
                      wm.addView(v, p)
                  }
                  refreshNotification()
              }

              private fun unlock() {
                  if (!locked) return
                  val v = view ?: return
                  locked = false
                  v.locked = false
                  v.invalidate()
                  val p = makeParams(true)
                  params = p
                  runCatching {
                      wm.removeView(v)
                      wm.addView(v, p)
                  }
                  refreshNotification()
              }

              private fun refreshNotification() {
                  getSystemService(NotificationManager::class.java).notify(1, buildNotification())
              }

              private fun buildNotification(): Notification {
                  val pi = PendingIntent.getService(this, 1,
                      Intent(this, OverlayService::class.java).setAction(ACTION_UNLOCK),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                  return Notification.Builder(this, CH)
                      .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                      .setContentTitle("Pool Aim")
                      .setContentText(if (locked) "Locked - game khelo" else "Editing")
                      .setOngoing(true)
                      .addAction(Notification.Action.Builder(null, "Unlock", pi).build())
                      .build()
              }

              override fun onDestroy() {
                  runCatching { reader?.close() }
                  runCatching { display?.release() }
                  runCatching { projection?.stop() }
                  view?.let { runCatching { wm.removeView(it) } }
                  runCatching { thread?.quitSafely() }
                  super.onDestroy()
              }

              companion object {
                  const val ACTION_START = "com.venice.poolaim.START"
                  const val ACTION_UNLOCK = "com.venice.poolaim.UNLOCK"
                  const val EXTRA_CODE = "code"
                  const val EXTRA_DATA = "data"
                  private const val CH = "overlay"
              }
          }
          EOF

          cat > app/src/main/java/com/venice/poolaim/AimView.kt <<'EOF'
          package com.venice.poolaim

          import android.annotation.SuppressLint
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PointF
          import android.graphics.RectF
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.atan2
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sin

          @SuppressLint("ViewConstructor")
          class AimView(context: Context) : View(context) {

              var onExit: (() -> Unit)? = null
              var onLock: (() -> Unit)? = null
              var locked = false

              private enum class Mode { CALIBRATE, AIM }
              private enum class Drag { NONE, TL, TR, BL, BR, BALL, AIM }

              private inner class Ball(var fx: Float, var fy: Float, var colorIdx: Int) {
                  var angle = 0f
                  var misses = 0
                  val fill = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
                  val line = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.STROKE
                      strokeWidth = 2.5f * d
                      alpha = 235
                  }
                  val ghost = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.STROKE
                      strokeWidth = 2f * d
                      alpha = 220
                  }
                  init { recolor(colorIdx) }

                  fun recolor(idx: Int) {
                      colorIdx = idx
                      val c = palette[idx]
                      fill.color = c
                      line.color = c
                      ghost.color = c
                  }
              }

              private val tableFrac = RectF(0.07f, 0.24f, 0.93f, 0.82f)
              private val table = RectF()
              private val balls = mutableListOf<Ball>()
              private var selected: Ball? = null

              private var mode = Mode.CALIBRATE
              private var auto = true
              private var showFan = true
              private var drag = Drag.NONE
              private var pressedBtn = -1

              private val d = resources.displayMetrics.density
              private val ballR: Float get() = max(5f * d, table.height() / 44f)
              private val pocketR: Float get() = ballR * 1.9f

              private val btnCal = RectF()
              private val btnAuto = RectF()
              private val btnFan = RectF()
              private val btnExit = RectF()
              private val btnLock = RectF()
              private val btnMinus = RectF()
              private val btnPlus = RectF()

              private val pFrame = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeWidth = 2f * d
                  color = Color.parseColor("#8060D8FF")
              }
              private val pFan = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeWidth = 1f * d
                  color = Color.parseColor("#40FFFFFF")
              }
              private val pPocket = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeWidth = 2f * d
                  color = Color.parseColor("#66FFFFFF")
              }
              private val pPocketHit = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeWidth = 4f * d
                  color = Color.parseColor("#FFFFD24A")
              }
              private val pSel = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeWidth = 2.5f * d
                  color = Color.WHITE
              }
              private val pHandle = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL; color = Color.parseColor("#CC00FFC8")
              }
              private val pBtn = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL; color = Color.parseColor("#CC1A222B")
              }
              private val pBtnOn = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL; color = Color.parseColor("#CC0E7C66")
              }
              private val pText = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE; textSize = 12f * d; textAlign = Paint.Align.CENTER
              }
              private val pNum = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE; textSize = 10f * d; textAlign = Paint.Align.CENTER
                  isFakeBoldText = true
              }

              private val palette = intArrayOf(
                  Color.WHITE,
                  Color.parseColor("#FFEB3B"), Color.parseColor("#1E88E5"),
                  Color.parseColor("#E53935"), Color.parseColor("#8E24AA"),
                  Color.parseColor("#FB8C00"), Color.parseColor("#43A047"),
                  Color.parseColor("#6D4C41"), Color.parseColor("#263238"),
                  Color.parseColor("#FFF59D"), Color.parseColor("#90CAF9"),
                  Color.parseColor("#EF9A9A"), Color.parseColor("#CE93D8")
              )

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  table.set(
                      tableFrac.left * w, tableFrac.top * h,
                      tableFrac.right * w, tableFrac.bottom * h
                  )

                  val bh = 40 * d
                  btnCal.set(8 * d, 8 * d, 8 * d + 86 * d, 8 * d + bh)
                  btnAuto.set(btnCal.right + 6 * d, 8 * d, btnCal.right + 6 * d + 66 * d, 8 * d + bh)
                  btnFan.set(btnAuto.right + 6 * d, 8 * d, btnAuto.right + 6 * d + 56 * d, 8 * d + bh)
                  btnExit.set(btnFan.right + 6 * d, 8 * d, btnFan.right + 6 * d + 44 * d, 8 * d + bh)
                  btnLock.set(w - 8 * d - 76 * d, 8 * d, w - 8 * d, 8 * d + bh)
                  val cy = h - 58 * d
                  btnMinus.set(w / 2f - 104 * d, cy - 21 * d, w / 2f - 60 * d, cy + 21 * d)
                  btnPlus.set(w / 2f + 60 * d, cy - 21 * d, w / 2f + 104 * d, cy + 21 * d)

                  clampAll()
                  invalidate()
              }

              private fun px(b: Ball) = PointF(b.fx * width, b.fy * height)

              private fun pockets(): List<PointF> = listOf(
                  PointF(table.left, table.top), PointF(table.right, table.top),
                  PointF(table.left, table.bottom), PointF(table.right, table.bottom),
                  PointF(table.left, table.centerY()), PointF(table.right, table.centerY())
              )

              private fun distToSeg(p: PointF, a: PointF, b: PointF): Float {
                  val abx = b.x - a.x
                  val aby = b.y - a.y
                  val len2 = abx * abx + aby * aby
                  if (len2 < 0.001f) return hypot(p.x - a.x, p.y - a.y)
                  var t = ((p.x - a.x) * abx + (p.y - a.y) * aby) / len2
                  t = t.coerceIn(0f, 1f)
                  return hypot(p.x - (a.x + abx * t), p.y - (a.y + aby * t))
              }

              private fun trace(sx: Float, sy: Float, dx0: Float, dy0: Float, bounces: Int): Pair<MutableList<PointF>, Int> {
                  val ins = ballR
                  val l = table.left + ins
                  val t = table.top + ins
                  val rt = table.right - ins
                  val b = table.bottom - ins
                  val pts = mutableListOf(PointF(sx, sy))
                  var px = sx
                  var py = sy
                  var dx = dx0
                  var dy = dy0
                  val pk = pockets()

                  repeat(bounces) {
                      var best = Float.MAX_VALUE
                      var axis = 0
                      if (dx > 0.0001f) { val v = (rt - px) / dx; if (v > 0 && v < best) { best = v; axis = 1 } }
                      if (dx < -0.0001f) { val v = (l - px) / dx; if (v > 0 && v < best) { best = v; axis = 1 } }
                      if (dy > 0.0001f) { val v = (b - py) / dy; if (v > 0 && v < best) { best = v; axis = 2 } }
                      if (dy < -0.0001f) { val v = (t - py) / dy; if (v > 0 && v < best) { best = v; axis = 2 } }
                      if (best == Float.MAX_VALUE) return Pair(pts, -1)

                      val ex = px + dx * best
                      val ey = py + dy * best
                      val a = PointF(px, py)
                      val e = PointF(ex, ey)

                      for (i in pk.indices) {
                          if (distToSeg(pk[i], a, e) < pocketR) {
                              pts.add(pk[i])
                              return Pair(pts, i)
                          }
                      }

                      pts.add(e)
                      px = ex
                      py = ey
                      if (axis == 1) dx = -dx else dy = -dy
                  }
                  return Pair(pts, -1)
              }

              private fun clampBall(b: Ball) {
                  val m = ballR / width
                  val mh = ballR / height
                  b.fx = b.fx.coerceIn(tableFrac.left + m, tableFrac.right - m)
                  b.fy = b.fy.coerceIn(tableFrac.top + mh, tableFrac.bottom - mh)
              }

              private fun clampAll() {
                  for (b in balls) clampBall(b)
              }

              private fun clearPath(a: PointF, b: PointF, skip: Ball?): Boolean {
                  for (o in balls) {
                      if (o === skip) continue
                      if (distToSeg(px(o), a, b) < ballR * 2.0f) return false
                  }
                  return true
              }

              private fun computeAims() {
                  val pk = pockets()
                  val cue = balls.firstOrNull { it.colorIdx == 0 }
                  for (b in balls) {
                      val bp = px(b)
                      if (b === cue) {
                          var bestA = b.angle
                          var bestS = Float.MAX_VALUE
                          for (t in balls) {
                              if (t === cue) continue
                              val tp = px(t)
                              var pocket: PointF? = null
                              var pd = Float.MAX_VALUE
                              for (p in pk) {
                                  if (!clearPath(tp, p, t)) continue
                                  val dd = hypot(p.x - tp.x, p.y - tp.y)
                                  if (dd < pd) { pd = dd; pocket = p }
                              }
                              if (pocket == null) continue
                              val dirX = (pocket.x - tp.x) / pd
                              val dirY = (pocket.y - tp.y) / pd
                              val gx = tp.x - dirX * ballR * 2f
                              val gy = tp.y - dirY * ballR * 2f
                              val gp = PointF(gx, gy)
                              if (!clearPath(bp, gp, cue)) continue
                              val s = hypot(gx - bp.x, gy - bp.y) + pd
                              if (s < bestS) { bestS = s; bestA = atan2(gy - bp.y, gx - bp.x) }
                          }
                          b.angle = bestA
                      } else {
                          var bestA = b.angle
                          var pd = Float.MAX_VALUE
                          for (p in pk) {
                              if (!clearPath(bp, p, b)) continue
                              val dd = hypot(p.x - bp.x, p.y - bp.y)
                              if (dd < pd) { pd = dd; bestA = atan2(p.y - bp.y, p.x - bp.x) }
                          }
                          b.angle = bestA
                      }
                  }
              }

              fun applyDetected(found: List<Detector.Det>) {
                  if (!auto || width == 0) return
                  val used = BooleanArray(found.size)
                  val it = balls.iterator()
                  while (it.hasNext()) {
                      val b = it.next()
                      var bi = -1
                      var bd = Float.MAX_VALUE
                      for (i in found.indices) {
                          if (used[i]) continue
                          val dd = hypot(found[i].fx * width - b.fx * width,
                                         found[i].fy * height - b.fy * height)
                          if (dd < bd) { bd = dd; bi = i }
                      }
                      if (bi >= 0 && bd < ballR * 3f) {
                          used[bi] = true
                          b.fx = found[bi].fx
                          b.fy = found[bi].fy
                          b.misses = 0
                          if (b.colorIdx != found[bi].color) b.recolor(found[bi].color)
                      } else {
                          b.misses++
                          if (b.misses > 3) it.remove()
                      }
                  }
                  for (i in found.indices) {
                      if (used[i]) continue
                      balls.add(Ball(found[i].fx, found[i].fy, found[i].color))
                  }
                  clampAll()
                  computeAims()
                  invalidate()
              }

              override fun onDraw(canvas: Canvas) {
                  canvas.drawRect(table, pFrame)
                  val pk = pockets()

                  val sel = selected
                  if (showFan && mode == Mode.AIM && sel != null && !locked && !auto) {
                      val sp = px(sel)
                      for (k in -3..3) {
                          if (k == 0) continue
                          val a2 = sel.angle + k * 0.05f
                          val sub = trace(sp.x, sp.y, cos(a2), sin(a2), 2)
                          val fp = Path()
                          sub.first.forEachIndexed { i, p -> if (i == 0) fp.moveTo(p.x, p.y) else fp.lineTo(p.x, p.y) }
                          canvas.drawPath(fp, pFan)
                      }
                  }

                  var hitPocket = -1
                  for (b in balls) {
                      val bp = px(b)
                      val res = trace(bp.x, bp.y, cos(b.angle), sin(b.angle), 4)
                      val path = Path()
                      res.first.forEachIndexed { i, p -> if (i == 0) path.moveTo(p.x, p.y) else path.lineTo(p.x, p.y) }
                      canvas.drawPath(path, b.line)
                      if (res.second < 0) {
                          val end = res.first.lastOrNull()
                          if (end != null) canvas.drawCircle(end.x, end.y, ballR, b.ghost)
                      }
                      if (b === sel) hitPocket = res.second
                  }

                  for (i in pk.indices) {
                      canvas.drawCircle(pk[i].x, pk[i].y, pocketR, if (hitPocket == i) pPocketHit else pPocket)
                  }

                  for (b in balls) {
                      val bp = px(b)
                      canvas.drawCircle(bp.x, bp.y, ballR, b.fill)
                      if (b === sel) canvas.drawCircle(bp.x, bp.y, ballR + 2f * d, pSel)
                      val label = if (b.colorIdx == 0) "C" else if (b.colorIdx <= 8) b.colorIdx.toString() else "+"
                      canvas.drawText(label, bp.x, bp.y + 3.5f * d, pNum)
                  }

                  if (sel != null && !locked && !auto) {
                      val sp = px(sel)
                      val hx = sp.x + cos(sel.angle) * ballR * 3.2f
                      val hy = sp.y + sin(sel.angle) * ballR * 3.2f
                      canvas.drawCircle(hx, hy, ballR * 0.55f, pHandle)
                  }

                  if (!locked) {
                      drawBtn(canvas, btnCal, if (mode == Mode.AIM) "AIM" else "CALIB", mode == Mode.AIM)
                      drawBtn(canvas, btnAuto, "AUTO", auto)
                      drawBtn(canvas, btnFan, "FAN", showFan)
                      drawBtn(canvas, btnExit, "X", false)
                      drawBtn(canvas, btnLock, "LOCK", false)
                      drawBtn(canvas, btnMinus, "-", false)
                      drawBtn(canvas, btnPlus, "+", false)
                  }
              }

              private fun drawBtn(canvas: Canvas, r: RectF, label: String, on: Boolean) {
                  canvas.drawRoundRect(r, 8f * d, 8f * d, if (on) pBtnOn else pBtn)
                  canvas.drawText(label, r.centerX(), r.centerY() + 4f * d, pText)
              }

              private fun hitBtn(x: Float, y: Float): Int {
                  val rects = listOf(btnCal, btnAuto, btnFan, btnExit, btnLock, btnMinus, btnPlus)
                  for (i in rects.indices) if (rects[i].contains(x, y)) return i
                  return -1
              }

              private fun nearestBall(x: Float, y: Float): Ball? {
                  var best: Ball? = null
                  var bestD = Float.MAX_VALUE
                  for (b in balls) {
                      val bp = px(b)
                      val dd = hypot(x - bp.x, y - bp.y)
                      if (dd < ballR * 2.5f && dd < bestD) { bestD = dd; best = b }
                  }
                  return best
              }

              private fun pickDrag(x: Float, y: Float): Drag {
                  if (mode == Mode.AIM) {
                      val b = nearestBall(x, y)
                      if (b != null) { selected = b; return Drag.BALL }
                      return if (selected != null) Drag.AIM else Drag.NONE
                  }
                  val thr = 48 * d
                  val corners = listOf(
                      Drag.TL to PointF(table.left, table.top),
                      Drag.TR to PointF(table.right, table.top),
                      Drag.BL to PointF(table.left, table.bottom),
                      Drag.BR to PointF(table.right, table.bottom)
                  )
                  var bestD = Float.MAX_VALUE
                  var best = Drag.NONE
                  for ((tag, p) in corners) {
                      val dd = hypot(x - p.x, y - p.y)
                      if (dd < thr && dd < bestD) { bestD = dd; best = tag }
                  }
                  return best
              }

              private fun applyDrag(x: Float, y: Float) {
                  val fx = x / width
                  val fy = y / height
                  when (drag) {
                      Drag.TL -> {
                          tableFrac.left = min(fx, tableFrac.right - 0.2f)
                          tableFrac.top = min(fy, tableFrac.bottom - 0.2f)
                          resync()
                      }
                      Drag.TR -> {
                          tableFrac.right = max(fx, tableFrac.left + 0.2f)
                          tableFrac.top = min(fy, tableFrac.bottom - 0.2f)
                          resync()
                      }
                      Drag.BL -> {
                          tableFrac.left = min(fx, tableFrac.right - 0.2f)
                          tableFrac.bottom = max(fy, tableFrac.top + 0.2f)
                          resync()
                      }
                      Drag.BR -> {
                          tableFrac.right = max(fx, tableFrac.left + 0.2f)
                          tableFrac.bottom = max(fy, tableFrac.top + 0.2f)
                          resync()
                      }
                      Drag.BALL -> {
                          selected?.let { it.fx = fx; it.fy = fy; it.misses = 0; clampBall(it) }
                      }
                      Drag.AIM -> {
                          val s = selected ?: return
                          val sp = px(s)
                          s.angle = atan2(y - sp.y, x - sp.x)
                      }
                      Drag.NONE -> return
                  }
              }

              private fun resync() {
                  table.set(
                      tableFrac.left * width, tableFrac.top * height,
                      tableFrac.right * width, tableFrac.bottom * height
                  )
                  clampAll()
              }

              @SuppressLint("ClickableViewAccessibility")
              override fun onTouchEvent(e: MotionEvent): Boolean {
                  if (locked) return true
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          pressedBtn = hitBtn(e.x, e.y)
                          if (pressedBtn != -1) { invalidate(); return true }
                          drag = pickDrag(e.x, e.y)
                          if (drag != Drag.NONE) { applyDrag(e.x, e.y); invalidate() }
                      }
                      MotionEvent.ACTION_MOVE -> if (drag != Drag.NONE) { applyDrag(e.x, e.y); invalidate() }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          val b = pressedBtn
                          pressedBtn = -1
                          if (b != -1 && b == hitBtn(e.x, e.y)) onButton(b)
                          drag = Drag.NONE
                          invalidate()
                      }
                  }
                  return true
              }

              private fun onButton(b: Int) {
                  when (b) {
                      0 -> mode = if (mode == Mode.CALIBRATE) Mode.AIM else Mode.CALIBRATE
                      1 -> {
                          auto = !auto
                          if (!auto) balls.clear()
                      }
                      2 -> showFan = !showFan
                      3 -> onExit?.invoke()
                      4 -> if (mode == Mode.AIM) onLock?.invoke()
                      5 -> selected?.let { it.angle -= 0.01f }
                      6 -> selected?.let { it.angle += 0.01f }
                  }
                  invalidate()
              }
          }
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pool-aim-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
