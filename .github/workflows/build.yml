name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Write project files
        run: |
          mkdir -p app/src/main/java/com/venice/poolaim
          mkdir -p app/src/main/res/layout

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "PoolAim"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          org.gradle.daemon=false
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.venice.poolaim"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.venice.poolaim"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "1.1"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:allowBackup="true"
                  android:label="Pool Aim"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Aim overlay for pool games" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="28dp"
              android:background="#101418">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Pool Aim"
                  android:textSize="26sp"
                  android:textStyle="bold"
                  android:textColor="#E6F4FF" />

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="14dp"
                  android:text="1. Overlay permission do\n2. Start dabao\n3. Game landscape mein kholo\n4. CALIB se table ke 4 kone align karo\n5. AIM pe jao, ball drag karke move karo, khaali jagah drag karke direction do\n6. LOCK dabao aur shot maaro"
                  android:textColor="#9AB0C0"
                  android:lineSpacingExtra="4dp" />

              <Button
                  android:id="@+id/btnPerm"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="24dp"
                  android:text="1. Overlay permission" />

              <Button
                  android:id="@+id/btnStart"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="10dp"
                  android:text="2. Start" />

              <Button
                  android:id="@+id/btnStop"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="10dp"
                  android:text="Stop" />
          </LinearLayout>
          EOF

          cat > app/src/main/java/com/venice/poolaim/MainActivity.kt <<'EOF'
          package com.venice.poolaim

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.Toast

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }

                  findViewById<Button>(R.id.btnPerm).setOnClickListener {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")))
                  }

                  findViewById<Button>(R.id.btnStart).setOnClickListener {
                      if (!Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "Pehle overlay permission do", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }
                      startForegroundService(Intent(this, OverlayService::class.java))
                      moveTaskToBack(true)
                  }

                  findViewById<Button>(R.id.btnStop).setOnClickListener {
                      stopService(Intent(this, OverlayService::class.java))
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/venice/poolaim/OverlayService.kt <<'EOF'
          package com.venice.poolaim

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.res.Configuration
          import android.graphics.PixelFormat
          import android.os.IBinder
          import android.view.Gravity
          import android.view.WindowManager

          class OverlayService : Service() {
              private lateinit var wm: WindowManager
              private var view: AimView? = null
              private var params: WindowManager.LayoutParams? = null
              private var locked = false

              override fun onBind(i: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  getSystemService(NotificationManager::class.java)
                      .createNotificationChannel(NotificationChannel(CH, "Overlay", NotificationManager.IMPORTANCE_LOW))
                  startForeground(1, buildNotification())

                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val p = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  )
                  p.gravity = Gravity.TOP or Gravity.START

                  val v = AimView(this)
                  v.onExit = { stopSelf() }
                  v.onLock = { lock() }
                  wm.addView(v, p)
                  view = v
                  params = p
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  val v = view ?: return
                  val p = params ?: return
                  runCatching {
                      wm.updateViewLayout(v, p)
                      v.requestLayout()
                      v.invalidate()
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_UNLOCK) unlock()
                  return START_STICKY
              }

              private fun lock() {
                  val p = params ?: return
                  locked = true
                  p.flags = p.flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  wm.updateViewLayout(view, p)
                  getSystemService(NotificationManager::class.java).notify(1, buildNotification())
              }

              private fun unlock() {
                  val p = params ?: return
                  locked = false
                  p.flags = p.flags and WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE.inv()
                  wm.updateViewLayout(view, p)
                  getSystemService(NotificationManager::class.java).notify(1, buildNotification())
              }

              private fun buildNotification(): Notification {
                  val pi = PendingIntent.getService(this, 1,
                      Intent(this, OverlayService::class.java).setAction(ACTION_UNLOCK),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                  return Notification.Builder(this, CH)
                      .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                      .setContentTitle("Pool Aim")
                      .setContentText(if (locked) "Locked - taps game tak" else "Editing")
                      .setOngoing(true)
                      .addAction(Notification.Action.Builder(null, "Unlock", pi).build())
                      .build()
              }

              override fun onDestroy() {
                  view?.let { runCatching { wm.removeView(it) } }
                  super.onDestroy()
              }

              companion object {
                  private const val CH = "overlay"
                  private const val ACTION_UNLOCK = "com.venice.poolaim.UNLOCK"
              }
          }
          EOF

          cat > app/src/main/java/com/venice/poolaim/AimView.kt <<'EOF'
          package com.venice.poolaim

          import android.annotation.SuppressLint
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PointF
          import android.graphics.RectF
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.atan2
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sin

          @SuppressLint("ViewConstructor")
          class AimView(context: Context) : View(context) {

              var onExit: (() -> Unit)? = null
              var onLock: (() -> Unit)? = null

              private enum class Mode { CALIBRATE, AIM }
              private enum class Drag { NONE, TL, TR, BL, BR, BALL, AIM }

              private inner class Ball(val fx: Float, val fy: Float, colorInt: Int, val label: String) {
                  var angle = 0f
                  val fill = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.FILL
                      color = colorInt
                  }
                  val line = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.STROKE
                      strokeWidth = 2.5f * d
                      color = colorInt
                  }
              }

              private val tableFrac = RectF(0.07f, 0.24f, 0.93f, 0.82f)
              private val table = RectF()
              private val balls = mutableListOf<Ball>()
              private var selected: Ball? = null

              private var mode = Mode.CALIBRATE
              private var showFan = true
              private var drag = Drag.NONE
              private var pressedBtn = -1

              private val d = resources.displayMetrics.density
              private val ballR: Float get() = max(5f * d, table.height() / 44f)
              private val pocketR: Float get() = ballR * 1.9f

              private val btnCal = RectF()
              private val btnFan = RectF()
              private val btnExit = RectF()
              private val btnLock = RectF()
              private val btnMinus = RectF()
              private val btnPlus = RectF()

              private val pFrame = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeWidth = 2f * d
                  color = Color.parseColor("#8060D8FF")
              }
              private val pFan = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeWidth = 1f * d
                  color = Color.parseColor("#40FFFFFF")
              }
              private val pPocket = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeWidth = 2f * d
                  color = Color.parseColor("#66FFFFFF")
              }
              private val pPocketHit = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeWidth = 4f * d
                  color = Color.parseColor("#FFFFD24A")
              }
              private val pSel = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeWidth = 2.5f * d
                  color = Color.WHITE
              }
              private val pHandle = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL; color = Color.parseColor("#CC00FFC8")
              }
              private val pBtn = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL; color = Color.parseColor("#CC1A222B")
              }
              private val pBtnOn = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL; color = Color.parseColor("#CC0E7C66")
              }
              private val pText = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE; textSize = 12f * d; textAlign = Paint.Align.CENTER
              }
              private val pNum = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE; textSize = 10f * d; textAlign = Paint.Align.CENTER
                  isFakeBoldText = true
              }
              private val pCall = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#FFFFD24A"); textSize = 15f * d
                  textAlign = Paint.Align.CENTER; isFakeBoldText = true
              }

              private val palette = intArrayOf(
                  Color.parseColor("#FFEB3B"), Color.parseColor("#1E88E5"),
                  Color.parseColor("#E53935"), Color.parseColor("#8E24AA"),
                  Color.parseColor("#FB8C00"), Color.parseColor("#43A047"),
                  Color.parseColor("#6D4C41"), Color.parseColor("#263238"),
                  Color.parseColor("#FFF59D"), Color.parseColor("#90CAF9"),
                  Color.parseColor("#EF9A9A"), Color.parseColor("#CE93D8")
              )

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  table.set(
                      tableFrac.left * w, tableFrac.top * h,
                      tableFrac.right * w, tableFrac.bottom * h
                  )

                  val bh = 42 * d
                  btnCal.set(8 * d, 8 * d, 8 * d + 92 * d, 8 * d + bh)
                  btnFan.set(btnCal.right + 6 * d, 8 * d, btnCal.right + 6 * d + 66 * d, 8 * d + bh)
                  btnExit.set(btnFan.right + 6 * d, 8 * d, btnFan.right + 6 * d + 46 * d, 8 * d + bh)
                  btnLock.set(w - 8 * d - 76 * d, 8 * d, w - 8 * d, 8 * d + bh)
                  val cy = h - 58 * d
                  btnMinus.set(w / 2f - 104 * d, cy - 21 * d, w / 2f - 60 * d, cy + 21 * d)
                  btnPlus.set(w / 2f + 60 * d, cy - 21 * d, w / 2f + 104 * d, cy + 21 * d)

                  if (balls.isEmpty()) seedBalls()
                  clampAll()
                  invalidate()
              }

              private fun seedBalls() {
                  for (i in 0 until 12) {
                      val c = i % 4
                      val r = i / 4
                      val tx = 0.22f + c * 0.19f
                      val ty = 0.24f + r * 0.17f
                      balls.add(Ball(
                          tableFrac.left + tx * tableFrac.width(),
                          tableFrac.top + ty * tableFrac.height(),
                          palette[i],
                          (i + 1).toString()
                      ))
                  }
                  balls.add(Ball(
                      tableFrac.left + 0.5f * tableFrac.width(),
                      tableFrac.top + 0.86f * tableFrac.height(),
                      Color.WHITE,
                      "C"
                  ))
                  selected = balls.last()
              }

              private fun px(b: Ball) = PointF(b.fx * width, b.fy * height)

              private fun pockets(): List<PointF> = listOf(
                  PointF(table.left, table.top), PointF(table.right, table.top),
                  PointF(table.left, table.bottom), PointF(table.right, table.bottom),
                  PointF(table.left, table.centerY()), PointF(table.right, table.centerY())
              )

              private val pocketNames = arrayOf(
                  "Top-Left", "Top-Right", "Bottom-Left", "Bottom-Right", "Left-Side", "Right-Side"
              )

              private fun distToSeg(p: PointF, a: PointF, b: PointF): Float {
                  val abx = b.x - a.x
                  val aby = b.y - a.y
                  val len2 = abx * abx + aby * aby
                  if (len2 < 0.001f) return hypot(p.x - a.x, p.y - a.y)
                  var t = ((p.x - a.x) * abx + (p.y - a.y) * aby) / len2
                  t = t.coerceIn(0f, 1f)
                  return hypot(p.x - (a.x + abx * t), p.y - (a.y + aby * t))
              }

              private fun trace(sx: Float, sy: Float, dx0: Float, dy0: Float, bounces: Int): Pair<MutableList<PointF>, Int> {
                  val ins = ballR
                  val l = table.left + ins
                  val t = table.top + ins
                  val rt = table.right - ins
                  val b = table.bottom - ins
                  val pts = mutableListOf(PointF(sx, sy))
                  var px = sx
                  var py = sy
                  var dx = dx0
                  var dy = dy0
                  val pk = pockets()

                  repeat(bounces) {
                      var best = Float.MAX_VALUE
                      var axis = 0
                      if (dx > 0.0001f) { val v = (rt - px) / dx; if (v > 0 && v < best) { best = v; axis = 1 } }
                      if (dx < -0.0001f) { val v = (l - px) / dx; if (v > 0 && v < best) { best = v; axis = 1 } }
                      if (dy > 0.0001f) { val v = (b - py) / dy; if (v > 0 && v < best) { best = v; axis = 2 } }
                      if (dy < -0.0001f) { val v = (t - py) / dy; if (v > 0 && v < best) { best = v; axis = 2 } }
                      if (best == Float.MAX_VALUE) return Pair(pts, -1)

                      val ex = px + dx * best
                      val ey = py + dy * best
                      val a = PointF(px, py)
                      val e = PointF(ex, ey)

                      for (i in pk.indices) {
                          if (distToSeg(pk[i], a, e) < pocketR) {
                              pts.add(pk[i])
                              return Pair(pts, i)
                          }
                      }

                      pts.add(e)
                      px = ex
                      py = ey
                      if (axis == 1) dx = -dx else dy = -dy
                  }
                  return Pair(pts, -1)
              }

              private fun clampBall(b: Ball) {
                  val m = ballR / width
                  val mh = ballR / height
                  b.fx = b.fx.coerceIn(tableFrac.left + m, tableFrac.right - m)
                  b.fy = b.fy.coerceIn(tableFrac.top + mh, tableFrac.bottom - mh)
              }

              private fun clampAll() {
                  for (b in balls) clampBall(b)
              }

              override fun onDraw(canvas: Canvas) {
                  canvas.drawRect(table, pFrame)
                  val pk = pockets()

                  val sel = selected
                  if (showFan && mode == Mode.AIM && sel != null) {
                      val sp = px(sel)
                      for (k in -3..3) {
                          if (k == 0) continue
                          val a2 = sel.angle + k * 0.05f
                          val sub = trace(sp.x, sp.y, cos(a2), sin(a2), 2)
                          val fp = Path()
                          sub.first.forEachIndexed { i, p -> if (i == 0) fp.moveTo(p.x, p.y) else fp.lineTo(p.x, p.y) }
                          canvas.drawPath(fp, pFan)
                      }
                  }

                  var hitPocket = -1
                  for (b in balls) {
                      val bp = px(b)
                      val res = trace(bp.x, bp.y, cos(b.angle), sin(b.angle), 3)
                      val path = Path()
                      res.first.forEachIndexed { i, p -> if (i == 0) path.moveTo(p.x, p.y) else path.lineTo(p.x, p.y) }
                      canvas.drawPath(path, b.line)
                      if (b === sel) hitPocket = res.second
                  }

                  for (i in pk.indices) {
                      canvas.drawCircle(pk[i].x, pk[i].y, pocketR, if (hitPocket == i) pPocketHit else pPocket)
                  }

                  for (b in balls) {
                      val bp = px(b)
                      canvas.drawCircle(bp.x, bp.y, ballR, b.fill)
                      if (b === sel) canvas.drawCircle(bp.x, bp.y, ballR + 2f * d, pSel)
                      canvas.drawText(b.label, bp.x, bp.y + 3.5f * d, pNum)
                  }

                  if (sel != null) {
                      val sp = px(sel)
                      val hx = sp.x + cos(sel.angle) * ballR * 3.2f
                      val hy = sp.y + sin(sel.angle) * ballR * 3.2f
                      canvas.drawCircle(hx, hy, ballR * 0.55f, pHandle)
                  }

                  if (hitPocket >= 0) {
                      canvas.drawText(pocketNames[hitPocket], width / 2f, height - 96 * d, pCall)
                  }

                  drawBtn(canvas, btnCal, if (mode == Mode.AIM) "AIM" else "CALIB", mode == Mode.AIM)
                  drawBtn(canvas, btnFan, "FAN", showFan)
                  drawBtn(canvas, btnExit, "X", false)
                  drawBtn(canvas, btnLock, "LOCK", false)
                  drawBtn(canvas, btnMinus, "-", false)
                  drawBtn(canvas, btnPlus, "+", false)
              }

              private fun drawBtn(canvas: Canvas, r: RectF, label: String, on: Boolean) {
                  canvas.drawRoundRect(r, 8f * d, 8f * d, if (on) pBtnOn else pBtn)
                  canvas.drawText(label, r.centerX(), r.centerY() + 4f * d, pText)
              }

              private fun hitBtn(x: Float, y: Float): Int {
                  val rects = listOf(btnCal, btnFan, btnExit, btnLock, btnMinus, btnPlus)
                  for (i in rects.indices) if (rects[i].contains(x, y)) return i
                  return -1
              }

              private fun nearestBall(x: Float, y: Float): Ball? {
                  var best: Ball? = null
                  var bestD = Float.MAX_VALUE
                  for (b in balls) {
                      val bp = px(b)
                      val dd = hypot(x - bp.x, y - bp.y)
                      if (dd < ballR * 2.5f && dd < bestD) { bestD = dd; best = b }
                  }
                  return best
              }

              private fun pickDrag(x: Float, y: Float): Drag {
                  if (mode == Mode.AIM) {
                      val b = nearestBall(x, y)
                      if (b != null) { selected = b; return Drag.BALL }
                      return if (selected != null) Drag.AIM else Drag.NONE
                  }
                  val thr = 48 * d
                  val corners = listOf(
                      Drag.TL to PointF(table.left, table.top),
                      Drag.TR to PointF(table.right, table.top),
                      Drag.BL to PointF(table.left, table.bottom),
                      Drag.BR to PointF(table.right, table.bottom)
                  )
                  var bestD = Float.MAX_VALUE
                  var best = Drag.NONE
                  for ((tag, p) in corners) {
                      val dd = hypot(x - p.x, y - p.y)
                      if (dd < thr && dd < bestD) { bestD = dd; best = tag }
                  }
                  return best
              }

              private fun applyDrag(x: Float, y: Float) {
                  val fx = x / width
                  val fy = y / height
                  when (drag) {
                      Drag.TL -> {
                          tableFrac.left = min(fx, tableFrac.right - 0.2f)
                          tableFrac.top = min(fy, tableFrac.bottom - 0.2f)
                          resync()
                      }
                      Drag.TR -> {
                          tableFrac.right = max(fx, tableFrac.left + 0.2f)
                          tableFrac.top = min(fy, tableFrac.bottom - 0.2f)
                          resync()
                      }
                      Drag.BL -> {
                          tableFrac.left = min(fx, tableFrac.right - 0.2f)
                          tableFrac.bottom = max(fy, tableFrac.top + 0.2f)
                          resync()
                      }
                      Drag.BR -> {
                          tableFrac.right = max(fx, tableFrac.left + 0.2f)
                          tableFrac.bottom = max(fy, tableFrac.top + 0.2f)
                          resync()
                      }
                      Drag.BALL -> {
                          selected?.let { it.fx = fx; it.fy = fy; clampBall(it) }
                      }
                      Drag.AIM -> {
                          val s = selected ?: return
                          val sp = px(s)
                          s.angle = atan2(y - sp.y, x - sp.x)
                      }
                      Drag.NONE -> return
                  }
              }

              private fun resync() {
                  table.set(
                      tableFrac.left * width, tableFrac.top * height,
                      tableFrac.right * width, tableFrac.bottom * height
                  )
                  clampAll()
              }

              @SuppressLint("ClickableViewAccessibility")
              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          pressedBtn = hitBtn(e.x, e.y)
                          if (pressedBtn != -1) { invalidate(); return true }
                          drag = pickDrag(e.x, e.y)
                          if (drag != Drag.NONE) { applyDrag(e.x, e.y); invalidate() }
                      }
                      MotionEvent.ACTION_MOVE -> if (drag != Drag.NONE) { applyDrag(e.x, e.y); invalidate() }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          val b = pressedBtn
                          pressedBtn = -1
                          if (b != -1 && b == hitBtn(e.x, e.y)) onButton(b)
                          drag = Drag.NONE
                          invalidate()
                      }
                  }
                  return true
              }

              private fun onButton(b: Int) {
                  when (b) {
                      0 -> mode = if (mode == Mode.CALIBRATE) Mode.AIM else Mode.CALIBRATE
                      1 -> showFan = !showFan
                      2 -> onExit?.invoke()
                      3 -> if (mode == Mode.AIM) onLock?.invoke()
                      4 -> selected?.let { it.angle -= 0.01f }
                      5 -> selected?.let { it.angle += 0.01f }
                  }
                  invalidate()
              }
          }
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pool-aim-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
